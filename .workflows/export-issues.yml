# .github/workflows/export-issues.yml
name: Export GitHub Issues to HTML

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # Every hour

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Export issues to HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/export_issues.py

      - name: Commit and push generated HTML
        run: |
          git config user.name "XuperX"
          git config user.email "itisfuqixu@gmail.com"
          git add docs/
          git commit -m "Update exported issues" || echo "No changes"
          git push
