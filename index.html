<!doctype html>
<html>
  <head>
    <title>Xure Blog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Random">

    <link rel="stylesheet" type="text/css" href="css/structure.css">
    <link rel="stylesheet" type="text/css" href="css/typography.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/themes/prism.min.css" rel="stylesheet" />
    <link href='https://fonts.googleapis.com/css?family=PT+Serif:400,400i,700' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=PT+Sans:700' rel='stylesheet' type='text/css'>

    <script src="https://buttons.github.io/buttons.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <script type="module">
      import { React, ReactDOM } from 'https://unpkg.com/es-react@16.12.0/dev';
      import htm from 'https://unpkg.com/htm?module';
      import { endpoint } from 'https://cdn.skypack.dev/@octokit/endpoint';
      import marked from 'https://unpkg.com/marked@0.8.0/lib/marked.esm.js';

      const html = htm.bind(React.createElement);

      const Header = () => html`
        <header>
          <h1 class="title">
            <a href="index.html"><strong>Xure's blog</strong></a>
          </h1>
          <p class="description">A blog site.</p>
        </header>
      `;

      const Comments = () => {
        const [comments, setComments] = React.useState();
        const issue_number = window.location.search.slice(1);

        React.useEffect(() => {
          async function fetchComments() {
            if (issue_number && !comments) {
              const { url, ...options } = endpoint('GET /repos/:owner/:repo/issues/:issue_number/comments', {
                owner: 'xuperx',
                repo: 'blog',
                issue_number,
              });

              const res = await fetch(url, options);
              setComments(await res.json());
              Prism.highlightAll();
            }
          }

          fetchComments();
        }, [issue_number, comments]);

        return html`
          <div id="comments" class="comments">
            <h2>Comments</h2>
            ${(comments || []).map(({ id, user, created_at, body }) => html`
              <div key=${id} class="comment">
                <a class="author" href=${user.html_url}>${user.login}</a>
                <span class="date">commented on ${new Date(created_at).toLocaleString()}:</span>
                <div class="body" dangerouslySetInnerHTML=${{ __html: marked(body) }} />
              </div>
            `)}
          </div>
        `;
      };

      const Posts = () => {
        const [issues, setIssues] = React.useState();
        const issue_number = window.location.search.slice(1);

        React.useEffect(() => {
          async function fetchIssues() {
            if (!issues) {
              const { url, ...options } = endpoint('GET /repos/:owner/:repo/issues', {
                owner: 'xuperx',
                repo: 'blog',
              });

              const res = await fetch(url, options);
              setIssues(await res.json());
              Prism.highlightAll();
            }
          }

          fetchIssues();
        }, [issues]);

        return html`
          <div class="posts">
            ${(issues || [])
              .filter(issue => issue.user.login === 'xuperx')
              .filter(issue => !issue_number || Number(issue_number) === issue.number)
              .map(issue => html`
                <div class="post" id=${issue.number} key=${issue.number}>
                  <h2 class="title"><a href="?${issue.number}">${issue.title}</a></h2>
                  ${issue.labels.length > 0 && html`
                    <div class="categories">
                      in
                      ${issue.labels.map(label => html`
                        <span key=${label.id} style=${{ color: '#' + label.color, padding: '0 .25em' }}>
                          ${label.name}
                        </span>
                      `)}
                    </div>
                  `}
                  <div class="meta">
                    <span>by <a href=${issue.user.html_url}>${issue.user.login}</a>, </span>
                    <span>${new Date(issue.created_at).toLocaleDateString()}</span>
                    ${issue.comments
                      ? html`<a href="?${issue.number}#comments">${issue.comments} comment(s)</a>`
                      : null}
                  </div>
                  ${issue_number && Number(issue_number) === issue.number && html`
                    <div class="body" dangerouslySetInnerHTML=${{ __html: marked(issue.body) }} />
                    <${Comments} />
                  `}
                </div>
              `)}
          </div>
        `;
      };

      ReactDOM.render(html`
        <${Header} />
        <${Posts} />
      `, document.getElementById('issuance'));
    </script>
  </head>
  <body>
    <div id="issuance"></div>
  </body>
</html>
